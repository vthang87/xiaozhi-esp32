<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation Focus — ESP32 AI Chat</title>
  <!--
    Assumptions:
    - The physical display is landscape 320×240; the browser preview scales it 3× only.
    - The existing global status bar, volume indicator, and fixed AI Chat / Music tabs remain.
    - Mic, volume down, and volume up each keep an independent 44×44 touch target.
    - All surfaces, borders, icons, and typography map to basic LVGL primitives.
  -->
  <style>
    * { box-sizing: border-box; }

    :root {
      --screen: #17191b;
      --panel: #222528;
      --line: #383d41;
      --text: #f4f1e9;
      --muted: #999fa2;
      --amber: #f0b84a;
      --cyan: #69c8cf;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0d0e0f;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .device {
      width: 320px;
      height: 240px;
      position: relative;
      overflow: hidden;
      background: var(--screen);
      border: 1px solid #42474a;
      box-shadow: 0 14px 36px rgba(0, 0, 0, .45);
      transform: scale(3);
      transform-origin: center;
    }

    .status {
      height: 23px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .9px;
      text-transform: uppercase;
    }

    .status-left,
    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ai-mark {
      padding: 2px 4px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--cyan);
    }

    .speaker {
      width: 11px;
      height: 11px;
      display: block;
      color: var(--text);
    }

    .content {
      height: 187px;
      padding: 6px 10px;
      display: grid;
      grid-template-rows: 23px 104px 44px;
      gap: 4px;
    }

    .chat-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .eyebrow {
      color: var(--text);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .9px;
      text-transform: uppercase;
    }

    .state {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--cyan);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .state-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 2px rgba(105, 200, 207, .13);
    }

    .transcript {
      overflow: hidden;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .message {
      min-height: 51px;
      padding: 7px 7px 6px 9px;
      position: relative;
    }

    .message + .message { border-top: 1px solid #2b2f32; }

    .message::before {
      content: "";
      width: 2px;
      position: absolute;
      top: 7px;
      bottom: 7px;
      left: 0;
      background: var(--cyan);
    }

    .message.user::before { background: var(--amber); }

    .message-meta {
      margin-bottom: 3px;
      color: var(--cyan);
      font-size: 7px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .message.user .message-meta { color: var(--amber); }

    .message-copy {
      max-width: 274px;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      line-height: 14px;
    }

    .voicebar {
      min-width: 0;
      padding: 0 140px 0 9px;
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .voice-copy { min-width: 0; }

    .voice-title {
      color: var(--cyan);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .voice-hint {
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .levels {
      height: 18px;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .levels i {
      width: 2px;
      display: block;
      background: var(--cyan);
    }

    .levels i:nth-child(1), .levels i:nth-child(7) { height: 4px; }
    .levels i:nth-child(2), .levels i:nth-child(6) { height: 8px; }
    .levels i:nth-child(3), .levels i:nth-child(5) { height: 13px; }
    .levels i:nth-child(4) { height: 18px; }

    button {
      margin: 0;
      padding: 0;
      border: 0;
      font: inherit;
    }

    .control-button {
      width: 44px;
      height: 44px;
      position: absolute;
      bottom: -1px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-bottom: 0;
      background: var(--cyan);
      color: #121416;
      font-size: 18px;
      font-weight: 800;
    }

    .control-button:active { background: var(--amber); }

    .volume-down,
    .volume-up {
      background: #1b1e20;
      color: var(--text);
    }

    .volume-down { right: 87px; }
    .volume-up { right: 43px; }
    .mic {
      right: -1px;
      border-color: var(--cyan);
    }
    .mic svg { width: 21px; height: 21px; }

    .nav {
      height: 30px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      overflow: hidden;
      border-top: 1px solid var(--line);
      background: #121416;
    }

    .tab {
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      overflow: hidden;
      color: #777d80;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .7px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tab + .tab { border-left: 1px solid var(--line); }
    .tab.active { color: var(--text); }

    .tab.active::after {
      content: "";
      width: 36px;
      height: 2px;
      position: absolute;
      bottom: 0;
      left: calc(50% - 18px);
      background: var(--amber);
    }

    .tab svg { width: 12px; height: 12px; flex: 0 0 auto; }

    @media (max-width: 1040px), (max-height: 800px) {
      .device { transform: scale(2.4); }
    }

    @media (max-width: 820px), (max-height: 620px) {
      .device { transform: scale(1.8); }
    }
  </style>
</head>
<body>
  <main class="device" aria-label="Conversation Focus AI chat concept">
    <header class="status">
      <div class="status-left">
        <span class="ai-mark">AI</span>
        <span>Chat</span>
      </div>
      <div class="status-right">
        <svg class="speaker" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/>
          <path d="M11 6c1 1.2 1 2.8 0 4M13 4c2.1 2.2 2.1 5.8 0 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span>72%</span>
      </div>
    </header>

    <section class="content">
      <div class="chat-heading">
        <div class="eyebrow">Conversation</div>
        <div class="state"><span class="state-dot"></span>Listening</div>
      </div>

      <div class="transcript" aria-label="Conversation transcript">
        <article class="message assistant">
          <div class="message-meta">Assistant</div>
          <div class="message-copy">Good morning. What would you like to do?</div>
        </article>
        <article class="message user">
          <div class="message-meta">You</div>
          <div class="message-copy">Play something relaxing from the SD card.</div>
        </article>
      </div>

      <div class="voicebar">
        <div class="voice-copy">
          <div class="voice-title">Voice input active</div>
          <div class="voice-hint">Tap the mic to stop</div>
        </div>
        <div class="levels" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <button class="control-button volume-down" type="button" aria-label="Decrease volume">−</button>
        <button class="control-button volume-up" type="button" aria-label="Increase volume">+</button>
        <button class="control-button mic" type="button" aria-label="Stop listening">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="8" y="3" width="8" height="12" rx="4" stroke="currentColor" stroke-width="2"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </section>

    <nav class="nav" aria-label="Primary">
      <div class="tab active">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 3.5h12v8H7l-3.5 2v-2H2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        AI Chat
      </div>
      <div class="tab">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="5" cy="12" r="2" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="12" cy="10.5" r="2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M7 12V4l7-1.5v8" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Music
      </div>
    </nav>
  </main>
</body>
</html>
