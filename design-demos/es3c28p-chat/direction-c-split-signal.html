<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split Signal — ESP32 AI Chat</title>
  <!--
    Assumptions:
    - Production canvas is exactly 320x240 px in landscape orientation.
    - The AI log contains short, recent utterances; older messages scroll inside the left pane only.
    - The 44x44 microphone target is the sole voice toggle and remains stationary.
    - Status and bottom navigation are shared with the selected Studio Precision music UI.
    - All geometry maps to basic LVGL objects: labels, lines, rectangles, and monochrome icons.
  -->
  <style>
    * { box-sizing: border-box; }

    :root {
      --screen: #17191b;
      --panel: #222528;
      --line: #383d41;
      --text: #f4f1e9;
      --muted: #999fa2;
      --amber: #f0b84a;
      --cyan: #69c8cf;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0d0e0f;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .device {
      width: 320px;
      height: 240px;
      position: relative;
      overflow: hidden;
      background: var(--screen);
      border: 1px solid #42474a;
      box-shadow: 0 14px 36px rgba(0, 0, 0, .45);
      transform: scale(3);
      transform-origin: center;
    }

    .status {
      height: 23px;
      padding: 0 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .9px;
      text-transform: uppercase;
    }

    .status-left,
    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ai-mark {
      padding: 2px 4px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--cyan);
    }

    .status svg {
      width: 11px;
      height: 11px;
      color: var(--text);
    }

    .workspace {
      height: 187px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 70px;
    }

    .conversation {
      min-width: 0;
      padding: 9px 10px 8px;
      overflow: hidden;
    }

    .conversation-head {
      height: 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--amber);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.35px;
      text-transform: uppercase;
    }

    .session {
      color: var(--muted);
      font-family: "Courier New", monospace;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .log {
      height: 147px;
      padding-top: 7px;
      display: grid;
      grid-template-rows: 44px 49px 39px;
      gap: 4px;
      overflow: hidden;
    }

    .message {
      min-width: 0;
      padding: 5px 7px 4px;
      border-left: 2px solid var(--line);
      background: #1d2022;
    }

    .message.user { border-left-color: var(--cyan); }
    .message.ai { border-left-color: var(--amber); }

    .speaker-label {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 7px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .user .speaker-label { color: var(--cyan); }
    .ai .speaker-label { color: var(--amber); }

    .message p {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 10px;
      font-weight: 600;
      line-height: 13px;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .message.pending {
      display: flex;
      align-items: center;
      gap: 7px;
      background: transparent;
    }

    .signal-mini {
      height: 14px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .signal-mini i {
      width: 2px;
      display: block;
      background: var(--amber);
    }

    .signal-mini i:nth-child(1), .signal-mini i:nth-child(5) { height: 4px; }
    .signal-mini i:nth-child(2), .signal-mini i:nth-child(4) { height: 9px; }
    .signal-mini i:nth-child(3) { height: 14px; }

    .pending-copy {
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .voice-panel {
      position: relative;
      padding: 9px 8px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-left: 1px solid var(--line);
      background: #141618;
    }

    .voice-label {
      align-self: stretch;
      color: var(--muted);
      font-size: 7px;
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
    }

    .voice-state {
      margin-top: 5px;
      color: var(--cyan);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .8px;
      text-align: center;
      text-transform: uppercase;
    }

    .level {
      height: 47px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .level i {
      width: 3px;
      display: block;
      background: var(--cyan);
    }

    .level i:nth-child(1), .level i:nth-child(7) { height: 8px; opacity: .5; }
    .level i:nth-child(2), .level i:nth-child(6) { height: 17px; opacity: .7; }
    .level i:nth-child(3), .level i:nth-child(5) { height: 29px; }
    .level i:nth-child(4) { height: 43px; background: var(--amber); }

    .mic {
      width: 44px;
      height: 44px;
      margin-top: 8px;
      display: grid;
      place-items: center;
      border: 1px solid var(--amber);
      border-radius: 50%;
      background: var(--amber);
      color: #17191b;
    }

    .mic svg { width: 20px; height: 20px; }

    .tap-hint {
      margin-top: 5px;
      color: var(--muted);
      font-size: 6px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .nav {
      width: 100%;
      height: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-top: 1px solid var(--line);
      background: #141618;
    }

    .tab {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      overflow: hidden;
      border-right: 1px solid var(--line);
      color: #7d8386;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .7px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .tab:last-child { border-right: 0; }
    .tab.active { color: var(--text); }
    .tab.active::before { background: var(--cyan); }

    .tab::before {
      width: 4px;
      height: 4px;
      content: "";
      border: 1px solid currentColor;
      background: transparent;
    }

    .tab svg { width: 12px; height: 12px; }
  </style>
</head>
<body>
  <main class="device" aria-label="Split Signal AI chat interface at 320 by 240 pixels">
    <header class="status">
      <div class="status-left">
        <span class="ai-mark">AI</span>
        <span>Assistant</span>
      </div>
      <div class="status-right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v10"/><path d="M8 9v2a4 4 0 0 0 8 0V9"/><path d="M5 11a7 7 0 0 0 14 0"/>
        </svg>
        <span>Online</span>
        <span>72%</span>
      </div>
    </header>

    <section class="workspace">
      <section class="conversation" aria-label="Conversation log">
        <div class="conversation-head">
          <span class="eyebrow">Live Conversation</span>
          <span class="session">SESSION 04</span>
        </div>

        <div class="log">
          <article class="message user">
            <div class="speaker-label">You · 10:42</div>
            <p>What is the weather like this afternoon?</p>
          </article>

          <article class="message ai">
            <div class="speaker-label">Assistant</div>
            <p>Warm and partly cloudy, with light rain possible after 4 PM.</p>
          </article>

          <div class="message pending" aria-label="Assistant is ready">
            <span class="signal-mini" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            <span class="pending-copy">Ready for voice</span>
          </div>
        </div>
      </section>

      <aside class="voice-panel" aria-label="Voice controls">
        <div class="voice-label">Voice</div>
        <div class="voice-state">Listening</div>
        <div class="level" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <button class="mic" type="button" aria-label="Stop listening">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v4"/><path d="M8 21h8"/>
          </svg>
        </button>
        <div class="tap-hint">Tap to mute</div>
      </aside>
    </section>

    <nav class="nav" aria-label="Primary navigation">
      <div class="tab active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
        <span>AI Chat</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        <span>Music</span>
      </div>
    </nav>
  </main>
</body>
</html>
