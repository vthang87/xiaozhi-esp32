<!doctype html>
<!-- Assumption: a calm storybook appliance for ages 5–10; scenery is flat CSS geometry. -->
<html><head><meta charset="utf-8"><title>Kids UI B — Storybook Garden</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#b9d5cf;font-family:Trebuchet MS,Arial,sans-serif}.device{width:320px;height:240px;transform:scale(3);overflow:hidden;position:relative;background:#f7edcf;border:2px solid #31534c;box-shadow:0 8px 0 #31534c;color:#24423d}.sky{height:25px;background:#8fd6da;display:flex;align-items:center;padding:0 9px;font-size:11px;font-weight:700}.sky b{font-size:14px;margin-right:auto}.stats{display:flex;gap:8px}.page{display:none;height:175px;position:relative;padding:8px 9px;background:#d9f0e7}.page.active{display:block}.hill{position:absolute;left:-20px;right:-20px;bottom:-34px;height:86px;border-radius:50%;background:#78bd76;border-top:2px solid #31534c}.sun{position:absolute;right:18px;top:13px;width:31px;height:31px;border:2px solid #31534c;border-radius:50%;background:#f5c84e}.friend{position:absolute;left:13px;top:18px;width:80px;height:84px;background:#ef765f;border:2px solid #31534c;border-radius:42px 42px 30px 30px;box-shadow:0 3px 0 #31534c}.eyes{text-align:center;font-size:24px;margin-top:24px}.message{position:absolute;left:103px;right:10px;top:19px;background:#fffaf0;border:2px solid #31534c;border-radius:18px 18px 18px 4px;padding:9px 10px;min-height:75px}.message small{color:#a25245;font-size:10px;font-weight:bold}.message p{font-family:Georgia,serif;font-size:15px;line-height:1.15;margin:5px 0}.tools{position:absolute;left:10px;right:10px;bottom:9px;display:grid;grid-template-columns:1fr 44px 44px 58px;gap:6px;z-index:2}.tools button,.talk{height:52px;border:2px solid #31534c;border-radius:16px;background:#fffaf0;box-shadow:0 3px 0 #31534c;font-weight:bold;font-size:18px}.talk{background:#f5c84e;font-size:24px}.hint{padding:8px;text-align:left;font-size:11px;line-height:1.15}.tabs{height:40px;display:grid;grid-template-columns:1fr 1fr;background:#fffaf0;border-top:2px solid #31534c;position:relative;z-index:5}.tab{border:0;background:transparent;color:#57716b;font-weight:900;font-size:13px}.tab.active{background:#ef765f;color:#fffaf0}.album{display:flex;gap:10px;position:relative;z-index:2}.art{width:68px;height:68px;border:2px solid #31534c;border-radius:50%;background:#ef765f;display:grid;place-items:center;font-size:28px;box-shadow:0 3px 0 #31534c}.song{flex:1}.song small{font-size:10px;color:#a25245;font-weight:bold}.song h2{font-family:Georgia,serif;font-size:17px;margin:4px 0 7px}.choose{height:30px;border:2px solid #31534c;border-radius:12px;background:#fffaf0;font-weight:900}.timeline{position:relative;z-index:2;margin-top:12px}.time{display:flex;justify-content:space-between;font-size:11px;font-weight:bold}.bar{height:8px;border:2px solid #31534c;border-radius:8px;background:#fffaf0;overflow:hidden}.bar i{display:block;width:43%;height:100%;background:#f5c84e}.controls{position:relative;z-index:2;display:grid;grid-template-columns:1fr 58px 1fr;gap:8px;margin-top:10px}.controls button{height:43px;border:2px solid #31534c;border-radius:16px;background:#fffaf0;box-shadow:0 3px 0 #31534c;font-size:18px}.controls .play{background:#f5c84e}
</style></head><body><main class="device"><header class="sky"><b>HI, BUDDY</b><div class="stats"><span>VOL 70</span><span>⌁</span><span>▰ 92%</span></div></header><section id="chat" class="page active"><div class="sun"></div><div class="hill"></div><div class="friend"><div class="eyes">• ᴗ •</div></div><div class="message"><small>YOUR AI FRIEND</small><p>Tell me about your favorite animal.</p></div><div class="tools"><div class="talk hint"><b>LET'S TALK</b><br>Tap and speak</div><button>−</button><button>+</button><button class="talk">●</button></div></section><section id="music" class="page"><div class="sun"></div><div class="hill"></div><div class="album"><div class="art">♫</div><div class="song"><small>STORY SONG · 03/14</small><h2>Acoustic Session</h2><button class="choose">PICK A SONG</button></div></div><div class="timeline"><div class="time"><span>1:42</span><span>3:58</span></div><div class="bar"><i></i></div></div><div class="controls"><button>◀</button><button class="play">Ⅱ</button><button>▶</button></div></section><nav class="tabs"><button class="tab active" data-page="chat">TALK</button><button class="tab" data-page="music">SONGS</button></nav></main><script>document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active')})</script></body></html>
