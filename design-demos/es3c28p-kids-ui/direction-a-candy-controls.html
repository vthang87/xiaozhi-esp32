<!doctype html>
<!-- Assumption: kids 5–10, exact 320×240, LVGL-safe opaque tiles, no external assets. -->
<html><head><meta charset="utf-8"><title>Kids UI A — Candy Controls</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#201c35;font-family:"Arial Rounded MT Bold",Nunito,Arial,sans-serif}.device{width:320px;height:240px;transform:scale(3);background:#fff7e8;overflow:hidden;border:2px solid #171224;box-shadow:0 8px 0 #100d1b;position:relative;color:#211b34}.status{height:25px;background:#6255d9;color:white;display:flex;align-items:center;padding:0 8px;font-size:12px;letter-spacing:.4px}.brand{font-size:14px;margin-right:auto}.stats{display:flex;gap:9px;align-items:center}.wifi{font-size:12px}.page{height:175px;padding:7px 8px;display:none}.page.active{display:block}.hero{display:grid;grid-template-columns:70px 1fr;gap:7px;height:76px}.buddy{background:#ffca43;border:2px solid #211b34;border-radius:22px;box-shadow:0 3px 0 #211b34;position:relative}.face{font-size:26px;text-align:center;margin-top:16px}.bubble{background:white;border:2px solid #211b34;border-radius:14px;padding:8px;box-shadow:0 3px 0 #211b34}.who{font-size:10px;color:#6255d9}.say{font-size:15px;line-height:1.1;margin-top:4px}.action-row{display:grid;grid-template-columns:1fr 42px 42px 56px;gap:6px;margin-top:8px}.ready{height:69px;background:#dff7ee;border:2px solid #211b34;border-radius:13px;padding:9px}.ready b{display:block;font-size:15px}.ready span{font-size:11px;color:#62555c}.key{height:53px;border:2px solid #211b34;border-radius:13px;background:#fff;box-shadow:0 3px 0 #211b34;font-size:22px;font-weight:900}.mic{height:69px;background:#ff5f66;color:#fff;font-size:26px}.tabs{height:40px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:2px solid #211b34}.tab{border:0;background:#fff;font-weight:900;font-size:14px;color:#756d86}.tab.active{background:#5d52d5;color:#fff}.music-head{display:flex;align-items:center;gap:7px}.cover{width:55px;height:55px;background:#4bc5b8;border:2px solid #211b34;border-radius:15px;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 0 #211b34}.track{flex:1}.track small{font-size:10px;color:#6255d9}.track h2{font-size:16px;margin:3px 0}.browse{height:30px;border:2px solid #211b34;border-radius:10px;background:#ffca43;font-weight:900}.time{display:flex;justify-content:space-between;font-size:11px;margin-top:13px}.progress{height:8px;border:2px solid #211b34;border-radius:8px;background:#fff;overflow:hidden}.progress i{display:block;width:43%;height:100%;background:#ff5f66}.controls{display:grid;grid-template-columns:1fr 62px 1fr;gap:8px;margin-top:13px}.controls button{height:45px;border:2px solid #211b34;border-radius:13px;background:#fff;box-shadow:0 3px 0 #211b34;font-size:20px}.controls .play{background:#ffca43;font-size:22px}
</style></head><body><main class="device"><header class="status"><b class="brand">HELLO!</b><div class="stats"><span>VOL 70</span><span class="wifi">●</span><span>▰ 92%</span></div></header><section id="chat" class="page active"><div class="hero"><div class="buddy"><div class="face">•ᴗ•</div></div><div class="bubble"><div class="who">YOUR AI FRIEND</div><div class="say">What should we discover today?</div></div></div><div class="action-row"><div class="ready"><b>READY TO CHAT</b><span>Tap mic to speak</span></div><button class="key">−</button><button class="key">+</button><button class="key mic">●</button></div></section><section id="music" class="page"><div class="music-head"><div class="cover">♫</div><div class="track"><small>NOW PLAYING · 03/14</small><h2>Acoustic Session</h2><button class="browse">CHOOSE SONG</button></div></div><div class="time"><b>1:42</b><b>3:58</b></div><div class="progress"><i></i></div><div class="controls"><button>◀</button><button class="play">Ⅱ</button><button>▶</button></div></section><nav class="tabs"><button class="tab active" data-page="chat">AI FRIEND</button><button class="tab" data-page="music">MUSIC</button></nav></main><script>document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active')})</script></body></html>
