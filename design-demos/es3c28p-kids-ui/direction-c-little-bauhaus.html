<!doctype html>
<!-- Assumption: age-flexible kids UI using Bauhaus learning-block geometry and no mascot dependency. -->
<html><head><meta charset="utf-8"><title>Kids UI C — Little Bauhaus</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ddd5c5;font-family:Arial,Helvetica,sans-serif}.device{width:320px;height:240px;transform:scale(3);overflow:hidden;position:relative;background:#f5ead5;border:2px solid #171717;box-shadow:8px 8px 0 #171717;color:#171717}.status{height:25px;border-bottom:2px solid #171717;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:800}.status b{font-size:14px;margin-right:auto}.stats{display:flex;gap:9px}.page{height:175px;padding:9px;display:none;position:relative}.page.active{display:block}.chat-grid{display:grid;grid-template-columns:78px 1fr;gap:9px}.totem{height:92px;position:relative}.circle{position:absolute;width:62px;height:62px;left:8px;top:0;border:2px solid #171717;border-radius:50%;background:#2677d8}.eye{color:white;text-align:center;font-size:23px;margin-top:18px}.base{position:absolute;width:78px;height:29px;bottom:0;border:2px solid #171717;background:#f3c62f}.copy{height:92px;border:2px solid #171717;background:white;padding:9px}.copy small{font-size:10px;font-weight:900;color:#d94a3a}.copy p{font-size:16px;line-height:1.08;margin:7px 0;font-weight:900}.tools{display:grid;grid-template-columns:1fr 43px 43px 57px;gap:7px;margin-top:9px}.tools>*{height:55px;border:2px solid #171717;background:white;font-size:20px;font-weight:900}.prompt{text-align:left;padding:8px;font-size:11px}.prompt b{font-size:14px}.tools .mic{background:#d94a3a;color:#fff;border-radius:50%}.tabs{height:40px;display:grid;grid-template-columns:1fr 1fr;border-top:2px solid #171717}.tab{border:0;border-right:2px solid #171717;background:#f5ead5;font-size:13px;font-weight:900}.tab:last-child{border:0}.tab.active{background:#2677d8;color:white}.music-top{display:grid;grid-template-columns:70px 1fr 61px;gap:8px;align-items:start}.disc{width:70px;height:70px;border:2px solid #171717;border-radius:50%;background:#2677d8;display:grid;place-items:center;color:white;font-size:26px}.song small{font-size:9px;font-weight:900;color:#d94a3a}.song h2{font-size:16px;line-height:1;margin:5px 0}.browse{height:32px;border:2px solid #171717;background:#f3c62f;font-weight:900}.flag{height:70px;border:2px solid #171717;background:white;display:grid;place-items:center;font-size:11px;font-weight:900;text-align:center}.flag i{display:block;width:18px;height:18px;background:#d94a3a;transform:rotate(45deg)}.timeline{margin-top:11px}.time{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.bar{height:8px;border:2px solid #171717;background:white}.bar i{display:block;width:43%;height:100%;background:#d94a3a}.controls{display:grid;grid-template-columns:1fr 62px 1fr;gap:7px;margin-top:10px}.controls button{height:43px;border:2px solid #171717;background:white;font-size:18px;font-weight:900}.controls .play{background:#f3c62f}
</style></head><body><main class="device"><header class="status"><b>AI CLUB</b><div class="stats"><span>VOL 70</span><span>●</span><span>▰92</span></div></header><section id="chat" class="page active"><div class="chat-grid"><div class="totem"><div class="circle"><div class="eye">• — •</div></div><div class="base"></div></div><div class="copy"><small>QUESTION OF THE DAY</small><p>What can we build together?</p></div></div><div class="tools"><div class="prompt"><b>SPEAK NOW</b><br>Tap the red circle</div><button>−</button><button>+</button><button class="mic">●</button></div></section><section id="music" class="page"><div class="music-top"><div class="disc">♫</div><div class="song"><small>TRACK 03 / 14</small><h2>Acoustic<br>Session</h2><button class="browse">FILES</button></div><div class="flag"><i></i>PLAYING</div></div><div class="timeline"><div class="time"><span>1:42</span><span>3:58</span></div><div class="bar"><i></i></div></div><div class="controls"><button>◀</button><button class="play">Ⅱ</button><button>▶</button></div></section><nav class="tabs"><button class="tab active" data-page="chat">AI CHAT</button><button class="tab" data-page="music">MUSIC</button></nav></main><script>document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active')})</script></body></html>
