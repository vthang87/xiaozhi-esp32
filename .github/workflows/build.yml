name: Build Boards

on:
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      board:
        description: Board directory to build (empty or "all" = every variant)
        required: false
        default: es3c28p

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: select
        name: Select variants based on changes
        env:
          DISPATCH_BOARD: ${{ github.event.inputs.board }}
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$DISPATCH_BOARD" || "$DISPATCH_BOARD" == "all" ]]; then
              {
                printf 'variants='
                python scripts/build.py --list-boards --json
              } >> "$GITHUB_OUTPUT"
            else
              FILTERED=$(python scripts/build.py --list-boards --json | python -c '
import json, os, sys
board = os.environ["DISPATCH_BOARD"]
print(json.dumps([v for v in json.load(sys.stdin) if v.get("board") == board], separators=(",", ":")))
')
              echo "variants=$FILTERED" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # push 到 main 分支，编译全部变体
          if [[ "$EVENT_NAME" == "push" ]]; then
            # Keep the full matrix out of an environment variable. A single
            # Linux environment entry is limited to 128 KiB, and the variant
            # JSON can exceed that as boards are added.
            {
              printf 'variants='
              python scripts/build.py --list-boards --json
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # pull_request to main: always build ES3C28P so the installer has firmware.
          # Do not use --select-changed here; a sync from upstream would expand into
          # the full board matrix.
          FILTERED=$(python scripts/build.py --list-boards --json | python -c '
import json, sys
print(json.dumps([v for v in json.load(sys.stdin) if v.get("board") == "es3c28p"], separators=(",", ":")))
')
          echo "variants=$FILTERED" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}
          if [ "${{ matrix.name }}" = "es3c28p" ]; then
            idf.py es3c28p_storybook_theme
            python scripts/prepare_installer.py es3c28p
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Upload installer firmware
        if: matrix.name == 'es3c28p'
        uses: actions/upload-artifact@v4
        with:
          name: installer-es3c28p
          path: web/installer/firmware/es3c28p/
          if-no-files-found: error

  esp32s31-idf61:
    name: Build ${{ matrix.full_name }} with IDF 6.1
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: espressif/esp32-s31-function-coreboard-1
            name: esp32-s31-function-coreboard-1
            full_name: espressif-esp32-s31-function-coreboard-1
          - board: espressif/esp32-s31-korvo-1
            name: esp32-s31-korvo-1
            full_name: espressif-esp32-s31-korvo-1
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S31 variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error

  installer:
    name: Pack xiaozhi-install
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write board catalog
        run: python scripts/prepare_installer.py

      - name: Download installer firmware
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: installer-es3c28p
          path: staging/installer-es3c28p

      - name: Assemble installer
        run: |
          mkdir -p web/installer/firmware
          shopt -s nullglob
          for dir in staging/installer-*; do
            name="${dir##*/installer-}"
            rm -rf "web/installer/firmware/$name"
            mv "$dir" "web/installer/firmware/$name"
            echo "packed $name"
          done
          find web/installer/firmware -type f | sort

      - name: Upload xiaozhi-install
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-install
          path: web/installer
          if-no-files-found: error

      - name: Deploy Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
